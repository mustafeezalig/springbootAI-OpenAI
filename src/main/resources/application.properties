#https://github.com/eazybytes/spring-ai.git
spring.application.name=springbootAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# Configuration for MySQL Database

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url = jdbc:mysql://localhost:3306/mustafeez
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql:true


#Qdrant properties
spring.docker.compose.stop.command=down
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=mustafeezai
#Embedding properties
spring.ai.ollama.embedding.enabled=false
#spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.vectorstore.qdrant.enabled=false